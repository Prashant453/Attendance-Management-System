services:
  - type: web
    name: attendify-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: attendance_db
      - key: DB_SSL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
