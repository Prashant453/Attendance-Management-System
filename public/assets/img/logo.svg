<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="att-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="att-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="att-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Diamond / Biometric Shield -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#att-primary-grad)" filter="url(#att-shadow)" />

  <!-- Biometric Scanner Corner Reticles -->
  <path d="M26 36 V28 H34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M74 36 V28 H66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M26 64 V72 H34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M74 64 V72 H66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Facial Biometric Contour -->
  <path d="M38 42 C38 35.37 43.37 30 50 30 C56.63 30 62 35.37 62 42 C62 49 55 57 50 61 C45 57 38 49 38 42 Z" 
        stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" fill="none" />

  <!-- Biometric Focal Iris / Scanner Waves -->
  <circle cx="50" cy="42" r="6" stroke="#38BDF8" stroke-width="2.5" fill="rgba(6, 182, 212, 0.25)" />
  
  <!-- Verified Attendance Checkmark -->
  <path d="M42 66 L48 72 L62 56" stroke="url(#att-glow-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
