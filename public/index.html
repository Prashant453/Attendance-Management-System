<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendify - Smart Facial Recognition Attendance System</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-logo-icon" style="margin: 0 auto 1rem; width: 52px; height: 52px; font-size: 1.5rem;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5z"></path>
                        <circle cx="12" cy="14" r="2"></circle>
                        <path d="M12 16v2"></path>
                    </svg>
                </div>
                <h1 style="font-size: 1.85rem; font-weight: 800; margin-bottom: 0.35rem;">Attendify</h1>
                <p style="font-size: 0.9rem; color: var(--text-secondary);">Facial Recognition Attendance System</p>
                <div style="margin-top: 0.5rem;">
                    <span class="brand-badge">TiDB Cloud Connected</span>
                </div>
            </div>

            <!-- Role Selector Tabs -->
            <div class="role-tabs" id="roleTabs">
                <div class="role-tab active" data-role="admin">Admin</div>
                <div class="role-tab" data-role="teacher">Faculty</div>
                <div class="role-tab" data-role="student">Student</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username" value="admin">
                </div>

                <div class="input-group">
                    <label for="password" style="display: flex; justify-content: space-between;">
                        <span>Password</span>
                        <a href="#" id="forgotPwLink" style="font-size: 0.8rem; font-weight: 500;">Forgot?</a>
                    </label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" value="admin123" style="padding-right: 2.75rem;">
                        <button type="button" id="togglePassword" style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center;">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); user-select: none;">
                        <input type="checkbox" id="rememberMe" checked style="width: auto; accent-color: var(--primary);"> Remember credentials
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; padding: 0.875rem;">
                    <span id="btnText">Sign In to Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Quick Demo Credentials Fill -->
            <div class="demo-badge-group">
                <span style="width: 100%; font-size: 0.725rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.25rem;">
                    Demo Quick-Fill:
                </span>
                <span class="demo-chip" onclick="fillDemo('admin', 'admin123', 'admin')">Admin (admin123)</span>
                <span class="demo-chip" onclick="fillDemo('prof_smith', 'teacher123', 'teacher')">Teacher (teacher123)</span>
                <span class="demo-chip" onclick="fillDemo('alex_j', 'student123', 'student')">Student (student123)</span>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reset Password</h3>
                <button class="modal-close-btn" onclick="closeForgotModal()">&times;</button>
            </div>
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.25rem;">
                Enter your registered username or email to receive password reset instructions.
            </p>
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" id="resetEmail" placeholder="e.g. admin@attendify.com">
            </div>
            <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn btn-secondary" onclick="closeForgotModal()">Cancel</button>
                <button class="btn btn-primary" onclick="sendResetRequest()">Send Reset Link</button>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        // Password visibility toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        toggleBtn.addEventListener('click', () => {
            const isPw = passwordInput.type === 'password';
            passwordInput.type = isPw ? 'text' : 'password';
            toggleBtn.style.color = isPw ? 'var(--primary)' : 'var(--text-muted)';
        });

        // Role Tabs
        const tabs = document.querySelectorAll('.role-tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const role = tab.dataset.role;
                if (role === 'admin') fillDemo('admin', 'admin123', 'admin');
                else if (role === 'teacher') fillDemo('prof_smith', 'teacher123', 'teacher');
                else if (role === 'student') fillDemo('alex_j', 'student123', 'student');
            });
        });

        function fillDemo(user, pw, role) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pw;
            tabs.forEach(t => {
                if (t.dataset.role === role) t.classList.add('active');
                else t.classList.remove('active');
            });
        }

        // Form Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            submitBtn.disabled = true;
            btnText.textContent = 'Authenticating...';

            const res = await apiRequest('/login', 'POST', { username, password });

            submitBtn.disabled = false;
            btnText.textContent = 'Sign In to Dashboard';

            if (res.token) {
                localStorage.setItem('token', res.token);
                localStorage.setItem('role', res.role);
                localStorage.setItem('full_name', res.full_name || username);
                localStorage.setItem('user_id', res.user_id);
                localStorage.setItem('username', res.username || username);
                
                showToast(`Welcome back, ${res.full_name || username}!`, 'success');

                setTimeout(() => {
                    if (res.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (res.role === 'teacher') {
                        window.location.href = 'teacher/dashboard.html';
                    } else {
                        window.location.href = 'student/dashboard.html';
                    }
                }, 700);
            } else {
                showToast(res.message || 'Login failed. Please check your credentials.', 'error');
            }
        });

        // Forgot Password Modal
        document.getElementById('forgotPwLink').onclick = (e) => {
            e.preventDefault();
            document.getElementById('forgotModal').classList.add('active');
        };

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
        }

        function sendResetRequest() {
            const input = document.getElementById('resetEmail').value;
            if (!input) {
                showToast('Please enter your email or username', 'warning');
                return;
            }
            showToast('Password reset link sent to registered email.', 'info');
            closeForgotModal();
        }
    </script>
</body>
</html>
